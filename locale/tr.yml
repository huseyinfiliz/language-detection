      load_failed: İstatistikler yüklenemedi.
      analytics_disabled: Dil istatistikleri kapalı olduğu için yeni kayıt tutulmuyor. Aşağıdakiler, kapatılmadan önce toplananlardır.

      card_requests_label: Sayfa görüntüleme
      card_requests_help: Bu dönemde sayılan tüm sayfa görüntülemeleri.
      card_visitors_label: Günlük ziyaretçi
      card_visitors_help: Bir ziyaretçi her gün için bir kez sayılır; üç ayrı gün gelen biri üç kez sayılır. Bu, kişi sayısı değildir.
      card_languages_label: İstenen dil
      card_languages_help: Ziyaretçilerin kaç farklı dil talep ettiği. Hiçbir dil belirtmeyen görüntülemeler burada sayılmaz.
      card_countries_label: Ülke
      card_countries_help: Ziyaretçilerin kaç ülkeye yerleştirildiği. Konumu belirlenemeyen adresler burada sayılmaz.
      card_served_label: Karşılanan
      card_served_help: Bu forumda kurulu olan bir dili talep eden sayfa görüntülemeleri.
      card_unserved_label: Karşılanmayan
      card_unserved_help: Bu forumda bulunmayan bir dili talep eden sayfa görüntülemeleri. Eksik sekmesi bunlarla ilgilidir.
      card_unstated_label: Tercih yok
      card_unstated_help: Tarayıcısı kullanılabilir bir dil belirtmeyen sayfa görüntülemeleri. Bunlar ne karşılandı ne de karşılanamadı. Karşılanan, karşılanmayan ve tercih yok toplamı, sayfa görüntüleme toplamına eşittir.

      languages_title: Ziyaretçilerin talep ettiği diller
