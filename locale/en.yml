huseyinfiliz-language-detection:
  # For more details on the format
  # Checkout https://docs.flarum.org/extend/i18n/#appendix-a-standard-key-format
  admin:
    settings:
      detection_order_label: Detection order
      detection_order_help: Which signal is tried first when working out a visitor's language.
      detection_order_browser_ip: Browser language, then IP country
      detection_order_ip_browser: IP country, then browser language

      default_locale_label: Fallback language
      default_locale_help: Applied when nothing could be detected. Leave this on the forum default to keep Flarum's own behaviour.
      default_locale_forum_default: Forum default

      enable_analytics_label: Collect language statistics
      enable_analytics_help: Records daily aggregated counts of the languages and countries visitors ask for. No IP addresses, request headers or visitor identifiers are stored.

      ignore_bots_label: Ignore bots and crawlers
      ignore_bots_help: Keeps known bots and crawlers out of the statistics. Their language is still detected, it is just not counted.

      retention_days_label: Keep statistics for
      retention_days_help: Daily rows older than this are deleted automatically.
      retention_days_never: Never delete
      retention_days_30: 30 days
      retention_days_90: 90 days
      retention_days_180: 180 days
      retention_days_365: 365 days

    ip_data:
      notice: IP country lookup uses a dataset bundled with this extension, built on {date} from public regional internet registry data. Updating the extension refreshes it.
      notice_unavailable: The bundled IP dataset is missing, so IP country lookup is inactive and only browser language detection will be used.

    cleanup:
      command_description: Delete language detection statistics older than the configured retention period.
      retention_disabled: Statistics are set to never be deleted, so nothing was removed.
      deleted: Deleted {count} statistics rows older than {days} days.
      nothing_to_delete: No statistics were old enough to delete.
