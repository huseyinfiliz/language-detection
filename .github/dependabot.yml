version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: flarum/core
        update-types: [version-update:semver-major]
      - dependency-name: flarum/testing
        update-types: [version-update:semver-major]
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  # Dependabot's npm ecosystem also manages Yarn lockfiles.
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Node typings must follow the Node 24 build runtime.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Compiler major upgrades require compatibility with Flarum's shared tsconfig.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      javascript-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ['*']
